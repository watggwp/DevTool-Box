<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script>
    try { document.querySelector('meta[name="color-scheme"]').content = localStorage.getItem("color-scheme") ?? "light dark"; } catch (e) {}
  </script>
  <title>Hex / Text | DevTools Box</title>
  <meta name="description" content="แปลงข้อความเป็น hex bytes และ hex dump">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand">
      <img src="/favicon.svg" width="26" height="26" alt="">
      <span>DevTools Box</span>
    </a>
    <div class="topbar-right">
      <span class="secure-badge" id="secureBadge" title="Web Serial ต้องใช้ HTTPS หรือ localhost"></span>
      <button class="theme-toggle" id="themeToggle" type="button">
        <span class="when-light" aria-hidden="true">&#9790;</span><span class="when-dark" aria-hidden="true">&#9728;</span>
        <span class="sr-only">สลับธีม</span>
      </button>
      <button class="menu-btn" id="menuBtn" aria-label="เปิดเมนู" aria-expanded="false" aria-controls="sidebar">&#9776;</button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="เครื่องมือ">
      <a href="/" class=""><span class="ico">&#8962;</span>หน้าแรก</a>
      <a href="/serial" class=""><span class="ico">⌁</span>Serial Monitor</a>
      <a href="/base64" class=""><span class="ico">64</span>Base64</a>
      <a href="/url" class=""><span class="ico">%</span>URL Encode</a>
      <a href="/hex" class="active"><span class="ico">0x</span>Hex / Text</a>
      <a href="/json" class=""><span class="ico">{}</span>JSON</a>
      <a href="/jwt" class=""><span class="ico">JWT</span>JWT Decoder</a>
      <a href="/hash" class=""><span class="ico">#</span>Hash / CRC</a>
      <a href="/time" class=""><span class="ico">⏱</span>Timestamp</a>
      <a href="/base" class=""><span class="ico">2/16</span>Number Base</a>
      <a href="/uuid" class=""><span class="ico">ID</span>UUID / Random</a>
    </nav>

    <main class="content">
      <section class="tool">
        <h1>Hex &harr; Text / Bytes</h1>
        <p class="hint">แปลงข้อความเป็น hex bytes และกลับ พร้อม hex dump เหมาะกับการเตรียม payload ส่งทาง serial หรือ debug protocol</p>
        <div class="card two-col">
          <div>
            <label for="hexText">ข้อความ (UTF-8)</label>
            <textarea id="hexText" rows="8" spellcheck="false"></textarea>
            <div class="row gap wrap">
              <button class="btn primary" id="hexToHex" type="button">&rarr; HEX</button>
              <label>คั่นด้วย <select id="hexSep"><option value="space">space</option><option value="none">none</option><option value="comma">, </option><option value="bsx">\x</option><option value="0x">0x </option></select></label>
              <label class="chk"><input type="checkbox" id="hexUpper" checked> ตัวพิมพ์ใหญ่</label>
            </div>
          </div>
          <div>
            <label for="hexOut">HEX</label>
            <textarea id="hexOut" rows="8" spellcheck="false" class="mono"></textarea>
            <div class="row gap wrap">
              <button class="btn primary" id="hexToText" type="button">&larr; Text</button>
              <button class="btn" type="button" data-copy="#hexOut">คัดลอก</button>
              <button class="btn ghost" type="button" data-clear="#hexText,#hexOut">ล้าง</button>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="row between"><strong>Hex dump</strong><span class="muted" id="hexCount"></span></div>
          <pre class="dump mono" id="hexDump"></pre>
        </div>
        <div class="notice err" id="hexErr" hidden></div>
      </section>

    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/js/common.js"></script>
  <script type="module" src="/js/hex.js"></script>
</body>
</html>
