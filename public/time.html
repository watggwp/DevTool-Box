<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script>
    try { document.querySelector('meta[name="color-scheme"]').content = localStorage.getItem("color-scheme") ?? "light dark"; } catch (e) {}
  </script>
  <title>Timestamp | DevTools Box</title>
  <meta name="description" content="Unix epoch ↔ วันที่เวลา (local / UTC)">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand">
      <img src="/favicon.svg" width="26" height="26" alt="">
      <span>DevTools Box</span>
    </a>
    <div class="topbar-right">
      <span class="secure-badge" id="secureBadge" title="Web Serial ต้องใช้ HTTPS หรือ localhost"></span>
      <button class="theme-toggle" id="themeToggle" type="button">
        <span class="when-light" aria-hidden="true">&#9790;</span><span class="when-dark" aria-hidden="true">&#9728;</span>
        <span class="sr-only">สลับธีม</span>
      </button>
      <button class="menu-btn" id="menuBtn" aria-label="เปิดเมนู" aria-expanded="false" aria-controls="sidebar">&#9776;</button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="เครื่องมือ">
      <a href="/" class=""><span class="ico">&#8962;</span>หน้าแรก</a>
      <a href="/serial" class=""><span class="ico">⌁</span>Serial Monitor</a>
      <a href="/base64" class=""><span class="ico">64</span>Base64</a>
      <a href="/url" class=""><span class="ico">%</span>URL Encode</a>
      <a href="/hex" class=""><span class="ico">0x</span>Hex / Text</a>
      <a href="/json" class=""><span class="ico">{}</span>JSON</a>
      <a href="/jwt" class=""><span class="ico">JWT</span>JWT Decoder</a>
      <a href="/hash" class=""><span class="ico">#</span>Hash / CRC</a>
      <a href="/time" class="active"><span class="ico">⏱</span>Timestamp</a>
      <a href="/base" class=""><span class="ico">2/16</span>Number Base</a>
      <a href="/uuid" class=""><span class="ico">ID</span>UUID / Random</a>
    </nav>

    <main class="content">
      <section class="tool">
        <h1>Unix Timestamp &harr; Date</h1>
        <p class="hint">แปลง epoch (วินาที / มิลลิวินาที) เป็นวันที่และกลับ แสดงทั้งเวลาท้องถิ่น UTC และ ISO 8601</p>
        <div class="card">
          <div class="row gap wrap">
            <strong>ตอนนี้:</strong><span class="mono" id="nowSec"></span><span class="muted">วินาที</span>
            <span class="mono" id="nowMs"></span><span class="muted">ms</span>
            <button class="btn" type="button" data-copy="#nowSec">คัดลอก</button>
            <span class="muted" id="tzInfo"></span>
          </div>
        </div>
        <div class="card two-col">
          <div>
            <label for="tsIn">Timestamp (s หรือ ms)</label>
            <input id="tsIn" class="mono wide" placeholder="1700000000">
            <button class="btn primary" id="tsToDate" type="button">&rarr; วันที่</button>
            <table class="tbl" id="tsResult"></table>
          </div>
          <div>
            <label for="dateIn">วันที่เวลา (local)</label>
            <input id="dateIn" type="datetime-local" step="1" class="wide">
            <button class="btn primary" id="dateToTs" type="button">&rarr; Timestamp</button>
            <table class="tbl" id="dateResult"></table>
          </div>
        </div>
        <div class="notice err" id="timeErr" hidden></div>
      </section>

    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/js/common.js"></script>
  <script type="module" src="/js/time.js"></script>
</body>
</html>
