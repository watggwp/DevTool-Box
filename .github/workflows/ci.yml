name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Build
        run: node build.mjs
      - name: Syntax check all browser scripts
        run: for f in src/assets/js/*.js dist/sw.js; do node --check "$f"; done
      - name: Test
        run: npm test
