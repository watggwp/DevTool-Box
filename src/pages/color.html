      <section class="tool">
        <h1>Color / RGB565</h1>
        <p class="hint">แปลงสีระหว่าง HEX, RGB, HSL, RGB565 และ RGB888 สำหรับจอ TFT / LCD (เช่น TFT_eSPI, Adafruit GFX) พิมพ์ช่องไหนก็ได้ ช่องอื่นอัปเดตทันที</p>

        <div class="two-col">
          <div class="card">
            <h2>เลือกสี</h2>
            <div class="color-top">
              <input type="color" id="cPicker" value="#ff8800" aria-label="ตัวเลือกสี">
              <div class="color-swatches">
                <div class="swatch-box"><div class="swatch" id="cSwatch"></div><span class="muted">สีที่เลือก (24-bit)</span></div>
                <div class="swatch-box"><div class="swatch" id="cSwatch565"></div><span class="muted">สีที่จอ RGB565 แสดงจริง</span></div>
              </div>
            </div>
            <div class="color-fields">
              <label>HEX <input id="cHex" class="mono" value="#FF8800" spellcheck="false" autocomplete="off"></label>
              <label>RGB565 (hex) <input id="c565" class="mono" spellcheck="false" autocomplete="off" placeholder="0xFC40"></label>
            </div>
            <div class="grid3">
              <label>R <input id="cR" type="number" min="0" max="255"></label>
              <label>G <input id="cG" type="number" min="0" max="255"></label>
              <label>B <input id="cB" type="number" min="0" max="255"></label>
              <label>H (°) <input id="cH" type="number" min="0" max="360"></label>
              <label>S (%) <input id="cS" type="number" min="0" max="100"></label>
              <label>L (%) <input id="cL" type="number" min="0" max="100"></label>
            </div>
          </div>

          <div class="card">
            <h2>ผลลัพธ์ (คลิกเพื่อคัดลอก)</h2>
            <table class="tbl" id="cOut"></table>
            <h2 style="margin-top:16px">Contrast ratio (WCAG)</h2>
            <div class="contrast-row">
              <div class="contrast" id="cOnWhite"></div>
              <div class="contrast" id="cOnBlack"></div>
            </div>
          </div>
        </div>

        <div class="card">
          <h2>สีมาตรฐาน TFT_eSPI (คลิกเพื่อเลือก)</h2>
          <div class="tft-grid" id="cTft"></div>
        </div>
        <div class="notice err" id="cErr" hidden></div>
      </section>
