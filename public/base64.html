<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script>
    try { document.querySelector('meta[name="color-scheme"]').content = localStorage.getItem("color-scheme") ?? "light dark"; } catch (e) {}
  </script>
  <title>Base64 | DevTools Box</title>
  <meta name="description" content="เข้ารหัส / ถอดรหัส Base64 รองรับ UTF-8, URL-safe และไฟล์">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand">
      <img src="/favicon.svg" width="26" height="26" alt="">
      <span>DevTools Box</span>
    </a>
    <div class="topbar-right">
      <span class="secure-badge" id="secureBadge" title="Web Serial ต้องใช้ HTTPS หรือ localhost"></span>
      <button class="theme-toggle" id="themeToggle" type="button">
        <span class="when-light" aria-hidden="true">&#9790;</span><span class="when-dark" aria-hidden="true">&#9728;</span>
        <span class="sr-only">สลับธีม</span>
      </button>
      <button class="menu-btn" id="menuBtn" aria-label="เปิดเมนู" aria-expanded="false" aria-controls="sidebar">&#9776;</button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="เครื่องมือ">
      <a href="/" class=""><span class="ico">&#8962;</span>หน้าแรก</a>
      <a href="/serial" class=""><span class="ico">⌁</span>Serial Monitor</a>
      <a href="/base64" class="active"><span class="ico">64</span>Base64</a>
      <a href="/url" class=""><span class="ico">%</span>URL Encode</a>
      <a href="/hex" class=""><span class="ico">0x</span>Hex / Text</a>
      <a href="/json" class=""><span class="ico">{}</span>JSON</a>
      <a href="/jwt" class=""><span class="ico">JWT</span>JWT Decoder</a>
      <a href="/hash" class=""><span class="ico">#</span>Hash / CRC</a>
      <a href="/time" class=""><span class="ico">⏱</span>Timestamp</a>
      <a href="/base" class=""><span class="ico">2/16</span>Number Base</a>
      <a href="/uuid" class=""><span class="ico">ID</span>UUID / Random</a>
    </nav>

    <main class="content">
      <section class="tool">
        <h1>Base64 Encode / Decode</h1>
        <p class="hint">เข้ารหัสและถอดรหัส Base64 รองรับภาษาไทยและ UTF-8, URL-safe และไฟล์ไบนารี ทำงานในเบราว์เซอร์ทั้งหมด</p>
        <div class="card two-col">
          <div>
            <div class="row between"><label for="b64In">ข้อความต้นฉบับ (Plain)</label><span class="muted" id="b64InLen">0 ตัวอักษร</span></div>
            <textarea id="b64In" rows="12" spellcheck="false"></textarea>
            <div class="row gap wrap">
              <button class="btn primary" id="b64Encode" type="button">เข้ารหัส &rarr; Base64</button>
              <label class="chk"><input type="checkbox" id="b64UrlSafe"> URL-safe (-_ ไม่มี =)</label>
              <input type="file" id="b64File" class="file-input">
              <label for="b64File" class="btn">เลือกไฟล์ &rarr; Base64</label>
            </div>
          </div>
          <div>
            <div class="row between"><label for="b64Out">Base64</label><span class="muted" id="b64OutLen">0 ตัวอักษร</span></div>
            <textarea id="b64Out" rows="12" spellcheck="false" class="mono"></textarea>
            <div class="row gap wrap">
              <button class="btn primary" id="b64Decode" type="button">&larr; ถอดรหัส Base64</button>
              <button class="btn" type="button" data-copy="#b64Out">คัดลอก</button>
              <button class="btn" id="b64DownloadBin" type="button">ถอดรหัสเป็นไฟล์</button>
              <button class="btn ghost" type="button" data-clear="#b64In,#b64Out">ล้าง</button>
            </div>
          </div>
        </div>
        <div class="notice err" id="b64Err" hidden></div>
      </section>

    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/js/common.js"></script>
  <script type="module" src="/js/base64.js"></script>
</body>
</html>
