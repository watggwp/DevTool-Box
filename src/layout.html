<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script>
    try { document.querySelector('meta[name="color-scheme"]').content = localStorage.getItem("color-scheme") ?? "light dark"; } catch (e) {}
  </script>
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESC}}">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
{{EXTRA_HEAD}}
</head>
<body class="{{BODYCLASS}}">
  <header class="bar">
    <div class="bar-in">
{{BAR}}
      <span class="bar-gap"></span>
      <button class="icon-btn" id="themeToggle" type="button" title="สลับธีมสว่าง / มืด">
        <span class="when-light" aria-hidden="true">&#9790;</span><span class="when-dark" aria-hidden="true">&#9728;</span>
        <span class="sr-only">สลับธีม</span>
      </button>
    </div>
  </header>

  <main class="page-main">
{{BODY}}
  </main>

{{FOOTER}}

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="{{SCRIPT}}"></script>
</body>
</html>
